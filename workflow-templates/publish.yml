name: publish-package

on:
  workflow_dispatch:

jobs:
  publish:
    # Use macos-latest or windows-latest if you want to publish to those platforms
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: install-ubuntu
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: post install
        run: |
          moon version --all
          moon update

      # Add -C if your moon.mod or moon.pkg is not in the root directory
      - name: prepublish check
        run: |
          moon fmt
          git diff --exit-code
          moon check
          moon test

      - name: publish
        env:
          SECRET: ${{ secrets.MOONCAKES_MOONBIT_COMMUNITY_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SECRET" ]; then
            echo "Error: MOONCAKES_MOONBIT_COMMUNITY_TOKEN secret is not set."
            echo "Please contact an admin to grant access to this secret."
            exit 1
          fi
          echo "$SECRET" > ~/.moon/credentials.json
          moon publish
          rm ~/.moon/credentials.json

      - name: tag published commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' moon.mod)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" \
            -f sha="$GITHUB_SHA"
