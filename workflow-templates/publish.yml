name: publish-package

on:
  workflow_dispatch:
    inputs:
      module_directory:
        description: Directory containing the module to publish
        required: true
        default: "."
        type: string

jobs:
  publish:
    # Use macos-latest or windows-latest if you want to publish to those platforms
    runs-on: ubuntu-latest
    env:
      MODULE_DIRECTORY: ${{ inputs.module_directory }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: install-ubuntu
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: post install
        run: |
          moon version --all
          moon -C "$MODULE_DIRECTORY" update

      - name: prepublish check
        run: |
          moon -C "$MODULE_DIRECTORY" fmt
          git diff --exit-code
          moon -C "$MODULE_DIRECTORY" check
          moon -C "$MODULE_DIRECTORY" test
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' "$MODULE_DIRECTORY/moon.mod")"
          if [[ -z "$version" ]]; then
            echo "could not read package version from $MODULE_DIRECTORY/moon.mod" >&2
            exit 1
          fi
          echo "PUBLISHED_TAG=v$version" >> "$GITHUB_ENV"

      - name: publish
        env:
          SECRET: ${{ secrets.MOONCAKES_MOONBIT_COMMUNITY_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SECRET" ]; then
            echo "Error: MOONCAKES_MOONBIT_COMMUNITY_TOKEN secret is not set."
            echo "Please contact an admin to grant access to this secret."
            exit 1
          fi
          echo "$SECRET" > ~/.moon/credentials.json
          moon -C "$MODULE_DIRECTORY" publish
          rm ~/.moon/credentials.json

      - name: tag published commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$PUBLISHED_TAG" \
            -f sha="$GITHUB_SHA"
